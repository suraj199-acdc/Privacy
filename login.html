<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Privacy</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;

            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;

            backdrop-filter: blur(25px);

            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo-icon {
            width: 60px;
            height: 60px;

            display: grid;
            place-items: center;

            margin: auto;
            margin-bottom: 14px;

            border-radius: 18px;

            background: linear-gradient(135deg,#8b5cf6,#ec4899);

            font-size: 28px;
        }

        .auth-logo h1 {
            font-size: 27px;
            margin-bottom: 5px;
        }

        .auth-logo p {
            color: #aaa2b9;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            color: #d8d2df;
            font-size: 12px;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            background: rgba(0,0,0,0.2);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 12px;

            outline: none;

            color: white;

            font-family: inherit;
            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #a78bfa;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 13px;
        }

        .forgot {
            display: block;

            text-align: right;

            margin-top: -8px;
            margin-bottom: 20px;

            color: #c4b5fd;

            text-decoration: none;

            font-size: 11px;
        }

        .login-submit {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 13px;

            color: white;

            background: linear-gradient(135deg,#8b5cf6,#ec4899);

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        .login-submit:hover {
            transform: translateY(-2px);
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            padding: 11px;

            margin-bottom: 18px;

            border-radius: 10px;

            font-size: 12px;

            text-align: center;
        }

        .message.error {
            display: block;

            color: #fca5a5;

            background: rgba(239,68,68,0.15);
        }

        .message.success {
            display: block;

            color: #86efac;

            background: rgba(34,197,94,0.15);
        }

        .auth-footer {
            margin-top: 22px;

            text-align: center;

            color: #aaa2b9;

            font-size: 12px;
        }

        .auth-footer a {
            color: #c4b5fd;

            text-decoration: none;

            font-weight: 600;
        }

        @media(max-width:500px) {

            .auth-card {
                padding: 28px 22px;
            }

        }

    </style>
</head>

<body>

<div class="background"></div>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="auth-logo-icon">
                💜
            </div>

            <h1>Welcome back</h1>

            <p>Enter your details to access Privacy.</p>

        </div>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Your password"
                        required
                    >

                    <span
                        class="show-password"
                        id="showPassword"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <a
                href="#"
                class="forgot"
                id="forgotPassword"
            >
                Forgot password?
            </a>


            <button
                type="submit"
                class="login-submit"
                id="loginButton"
            >
                Log in
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </div>

    </div>

</div>


<script type="module" src="js/auth.js"></script>

</body>
</html>
